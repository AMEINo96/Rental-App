{% extends 'base.html' %}

{% block content %}
<div class="search-bar">
    <form action="{{ url_for('index') }}" method="get">
        <input type="text" name="q" placeholder="Search for unusual items..."
            value="{{ search_query if search_query else '' }}">
        <button type="submit">Search</button>
    </form>
</div>

<div class="items-grid">
    {% for item in items %}
    <div class="item-card">
        <a href="{{ url_for('item_details', item_id=item.id) }}"
            style="text-decoration: none; color: inherit; display: block;">
            {% if item.image_filename %}
            <img src="{{ url_for('static', filename='uploads/' + item.image_filename) }}" alt="{{ item.title }}"
                class="item-image">
            {% else %}
            <img src="https://via.placeholder.com/300x200?text=No+Image" alt="No Image" class="item-image">
            {% endif %}
            <div class="item-details">
                <h3 class="item-title">{{ item.title }}</h3>
                <p class="item-price">{{ item.price }}</p>
                <p><strong>Condition:</strong> {{ item.condition }}</p>
            </div>
        </a>
    </div>
    {% else %}
    <p class="no-items-message">No items found. Be the first to rent something unusual!</p>
    {% endfor %}
</div>
{% endblock %}
