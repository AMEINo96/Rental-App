<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unusual Rentals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Unusual Rentals</a>
        <nav>
            <a href="{{ url_for('index') }}">Buy/Rent</a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('rent') }}">Rent your things</a>
            <a href="{{ url_for('my_listings') }}">My Listings</a>
            <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('signup') }}" class="btn-contact">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
